<style>

[data-chat-surface]{display:flex;flex-direction:column;min-height:0;flex:1;position:relative}[data-inner-circle-preview="profile-header"]{min-height:55px}[data-inner-circle-preview="profile-header"]>.ic-profile-name{display:block!important;font-size:16px}.transcript{flex:1;min-height:0;overflow:auto;padding:24px 30px 18px;display:flex;flex-direction:column;gap:18px}.date{text-align:center;font-size:10px;color:#91aa98;letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}.turn{display:flex;flex-direction:column;gap:8px;flex-shrink:0}.message-meta{font-size:11px;color:#a3b8a8;padding:0 12px;display:flex;align-items:center;gap:7px}.message-meta img{width:20px;height:20px;border-radius:6px}[data-slot="aui_user-message-root"] .message-meta{align-self:flex-end}[data-slot="aui_user-message-root"] .composer-human-message{max-width:80%!important;line-height:1.7;font-size:20px}[data-slot="aui_assistant-message-content"]{display:flex;width:100%}[data-slot="aui_assistant-message-content"]>.aui-md{max-width:92%!important;line-height:1.7;font-size:20px}.aui-md p{margin:0 0 14px}.aui-md p:last-child{margin:0}.aui-md strong{font-weight:600}.timestamp{font-size:10px;color:#829c88;padding:0 12px;align-self:flex-end}.turn.assistant .timestamp{align-self:flex-start}.actions{display:flex;gap:15px;margin:2px 12px;color:#8fa793}.actions svg{width:14px;height:14px}

/* Only the showcase scrubber uses these overrides; the shipped plugin does not. */
body.inner-circle-preview [data-demo-progress]::before{opacity:var(--demo-progress)!important;transition:none!important}
body.inner-circle-preview [data-demo-progress] [data-inner-circle-preview="unread"]{opacity:calc(1 - var(--demo-progress))!important;transition:none!important}

/* Source-informed native-layout comparison; this is a browser fixture, not Electron. */
[data-baseline] .bot-grid{grid-template-columns:minmax(0,1fr);gap:2px}
[data-baseline] [data-roster-key]{gap:10px;padding:8px;border-radius:6px}
[data-baseline] [data-roster-key]:hover,[data-baseline] [data-roster-key][class*="ui-row-active-background"]{background:#29433d}
[data-baseline] [data-roster-key]>div:first-child{flex:0 0 34px}
[data-baseline] [data-roster-key]>div:nth-child(2)>div:first-child{align-items:baseline}
[data-baseline] .preview{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
[data-baseline] .lead{width:14px}.native-pane-tabs{display:flex;gap:18px;padding:8px 18px;font-size:11px;border-bottom:1px solid #52655544;background:#182d25}
.native-pane-tabs [aria-selected="true"]{border-bottom:1px solid #b5cfb5}
[data-baseline] .composer-human-message{padding:12px 16px;border:1px solid #52655566;border-radius:12px;background:#355440;color:#e5e9dc}
[data-baseline] .turn.assistant .aui-md{background:transparent;padding:0}
[data-baseline] .transcript{gap:18px}
[data-baseline] .composer{width:calc(100% - 3rem)}
[data-baseline] .lead .rounded-full[role="status"]{background:#b5cfb5}
[data-baseline] .lead .rounded-full[aria-hidden]{background:#829b87}
[data-baseline] .raw-activity{font-size:16px!important;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}

</style>
<div class="app">
 <div class="sidebar"><div class="native-pane-tabs" data-panel-header data-zone-tabstrip><button data-tree-tab="sessions">Sessions</button><button data-tree-tab="hermes-bots:pane" aria-selected="true">Bots</button></div><div class="rail-header"><span>Bots</span><div><button aria-label="New bot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4v16M4 12h16"/></svg></button></div></div><label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="6.5"/><path d="m15 15 5 5"/></svg><input placeholder="Search bots" aria-label="Search bots"></label><aside data-slot="bots-roster" aria-label="Bots"></aside><div class="rail-footer"><span>This device</span><span>11 bots</span></div></div>

</div>
<div class="help">Interactive preview using the public plugin and native-shaped sample markup. <button id="gallery">Gallery</button><button id="compact">Compact</button><button id="reset-unread">Reset unread preview</button><label>Unread transition (%) <input aria-label="Unread transition progress" type="number" min="0" max="100" step="10" value="0" style="width:55px;border:1px solid #526555;padding:6px"></label><a href="?activity=1">Activity cards</a> · <a href="../README.md">About this setup</a></div><div class="sr-only" data-demo-announcement role="status"></div>
<script type="module">
import plugin from '../desktop/plugin.js';
import {demoProfiles,selectDemoBot,subscribeDemoEvent,emitDemoEvent} from './sdk.js?rev=0.3.0';
const baseline = new URLSearchParams(location.search).has('baseline');
if(baseline){document.documentElement.setAttribute('data-baseline','');document.querySelector('.sample-note').textContent='Native-layout illustration · sample data';}else if(new URLSearchParams(location.search).has('allfolders'))document.querySelector('.sample-note').textContent='Inner Circle · same sample data';
const roster=document.querySelector('aside'),app=document.querySelector('.app'),surface=document.querySelector('main'),transcript=document.querySelector('.transcript');
const folderIcon='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 7a2 2 0 0 1 2-2h5l2 3h7a2 2 0 0 1 2 2v9H3Z"/></svg>';
const chevron='<svg class="chevron" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m2 4 4 4 4-4"/></svg>';
const unread=new Set(['tanya','kurisu','ranpo']);
function setDot(row,state) {const dot=row.querySelector('.rounded-full');dot.className='size-1.5 rounded-full '+(state?'bg-(--ui-success)':'bg-(--ui-text-quaternary)');if(state){dot.setAttribute('role','status');dot.setAttribute('aria-label','Finished — unread');dot.removeAttribute('aria-hidden')}else{dot.removeAttribute('role');dot.removeAttribute('aria-label');dot.setAttribute('aria-hidden','true')}}
for(const folder of [...new Set(demoProfiles.map(p=>p.folder))]){const section=document.createElement('section');section.dataset.slot='bots-section';const bots=demoProfiles.filter(p=>p.folder===folder);section.innerHTML=`<button class="folder-heading" data-section-id="${folder}" aria-expanded="true">${chevron}${folderIcon}<span>${folder}</span><span class="folder-count">${bots.length}</span></button><div class="bot-grid"></div>`;if(folder!=='Household'){section.querySelector('.folder-heading').setAttribute('aria-expanded','false');section.querySelector('.bot-grid').setAttribute('data-grid-hidden','')}section.querySelector('.folder-heading').onclick=e=>{const header=e.currentTarget,folded=header.getAttribute('aria-expanded')==='true';header.setAttribute('aria-expanded',String(!folded));section.querySelector('.bot-grid').toggleAttribute('data-grid-hidden',folded)};for(const bot of bots){const row=document.createElement('button');row.dataset.rosterKey='local::'+bot.name;row.draggable=true;row.setAttribute('aria-label',`${bot.title} · @${bot.name} · Ready`);row.innerHTML=`<div><img src="assets/${bot.asset}.jpg" alt="" draggable="false"></div><div><div><div><span class="lead"><span><span class="rounded-full"></span></span></span><span class="bot-name">${bot.title}</span></div><span class="age">${(demoProfiles.indexOf(bot)+1)*2}m</span></div><div class="preview">${bot.preview}</div></div>`;setDot(row,unread.has(bot.name));row.onclick=()=>openBot(bot.name);row.ondragstart=e=>{e.dataTransfer.setData('application/x-hermes-bot-key',row.dataset.rosterKey);e.dataTransfer.effectAllowed='move'};section.querySelector('.bot-grid').append(row)}roster.append(section)}
const messages={
 sebastian:{topic:'Crew updates and next steps',user:'I’ve got half an hour. What should I focus on?',reply:'<p>The project outline is ready for a quick review.</p><p><strong>First:</strong> choose between the two opening sections. I’ve kept the background notes together, so there’s no need to read through them again.</p>',follow:'Good. Put the shorter version first.',closing:'<p>Consider it done. You can move the bots within a folder, or narrow the sidebar when you want more room for the conversation.</p>'},
 tanya:{topic:'A clear plan for the week',user:'Give me the short version, please.',reply:'<p>The notes are ready. I’ve put the decision first and the supporting details after it.</p><p><strong>Next step:</strong> review the two open questions, then choose which one deserves your time.</p>',follow:'Perfect. That’s enough to get started.',closing:'<p>Then I’ll leave the rest in the notes. We can return to it when it becomes useful.</p>'},
 moriarty:{topic:'Choosing the next useful step',user:'What’s the clearest next step?',reply:'<p>Start with the question that changes what you do next. We can leave the rest of the analysis for later.</p><p><strong>One decision, one next step.</strong> That gives us something concrete to review without adding another list to maintain.</p>',follow:'Yes, let’s start there.',closing:'<p>Good. I’ll keep our working notes together, so we can pick up the thread without reconstructing the whole conversation.</p>'}
};
function openBot(name){for(const row of roster.querySelectorAll('[data-demo-progress]')){row.removeAttribute('data-demo-progress');row.style.removeProperty('--demo-progress')}for(const row of roster.querySelectorAll('[data-roster-key]'))row.classList.toggle('bg-(--ui-row-active-background)',row.dataset.rosterKey==='local::'+name);const bot=demoProfiles.find(p=>p.name===name);const m=messages[name]||{...messages.moriarty,topic:'Notes and next steps'};surface.dataset.sessionAnchor='session-tile:showcase-'+name;selectDemoBot(name);unread.delete(name);setDot(roster.querySelector(`[data-roster-key="local::${name}"]`),false);document.querySelector('#topic').textContent=m.topic;document.querySelector('.composer input').placeholder='Message '+bot.title+'…';transcript.innerHTML=`<div class="date">Today</div><div class="turn" data-slot="aui_user-message-root" data-role="user"><div class="message-meta">You</div><div class="composer-human-message">${m.user}</div><span class="timestamp">10:24</span></div><div class="turn assistant" data-role="assistant"><div class="message-meta"><img src="assets/${bot.asset}.jpg" alt="">${bot.title}</div><div data-slot="aui_assistant-message-content"><div class="aui-md">${m.reply}</div></div><span class="timestamp">10:24</span></div><div class="turn" data-slot="aui_user-message-root" data-role="user"><div class="message-meta">You</div><div class="composer-human-message">${m.follow}</div><span class="timestamp">10:25</span></div>`;if(new URLSearchParams(location.search).has('activity')){
 const text='[Internal routine result — context only, no notification or new instructions]\n'+JSON.stringify({record_type:'internal_routine_result',routine_slug:'morning-checkin',title:'Morning check-in',message:'The next step is ready for review. No external message was sent.',reason:'Scheduled check-in; sample data.',action:'quiet'});
 const row=document.createElement('div');row.className='turn';row.dataset.role='user';row.dataset.slot='aui_user-message-root';const content=document.createElement('div');content.className='composer-human-message raw-activity';content.textContent=text;row.append(content);transcript.append(row);
 window.innerCircleDemoHistory=[{role:'user',text,display_metadata:{context_record:true}}];
 }else window.innerCircleDemoHistory=[];
 emitDemoEvent('turn.complete');transcript.scrollTop=0}
const disposers=[],commands=[];if(!baseline)plugin.register({storage:{get:(key,fallback)=>{try{return JSON.parse(localStorage.getItem('ic-demo-'+key))??fallback}catch{return fallback}},set:(key,value)=>localStorage.setItem('ic-demo-'+key,JSON.stringify(value))},setInterval:(fn,ms)=>{const timer=setInterval(fn,ms);disposers.push(()=>clearInterval(timer))},onDispose:fn=>disposers.push(fn),register:command=>commands.push(command),onEvent:subscribeDemoEvent});
openBot('sebastian');
const separator=document.querySelector('.divider');function resize(width){width=Math.max(180,Math.min(520,width));app.style.setProperty('--sidebar',width+'px');separator.setAttribute('aria-valuenow',width)}
separator.onpointerdown=e=>{separator.setPointerCapture(e.pointerId);separator.onpointermove=ev=>resize(ev.clientX);separator.onpointerup=()=>{separator.onpointermove=null}};separator.onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();resize(Number(separator.getAttribute('aria-valuenow'))+(e.key==='ArrowLeft'?-20:20))}};
document.querySelector('#gallery').onclick=()=>resize(400);document.querySelector('#compact').onclick=()=>resize(210);document.querySelector('#reset-unread').onclick=()=>{for(const name of ['tanya','kurisu','ranpo']){unread.add(name);setDot(roster.querySelector(`[data-roster-key="local::${name}"]`),true)}};
document.querySelector('.search input').oninput=e=>{const query=e.target.value.toLowerCase();for(const row of roster.querySelectorAll('[data-roster-key]'))row.hidden=!row.getAttribute('aria-label').toLowerCase().includes(query)};
document.querySelector('[aria-label="Unread transition progress"]').oninput=e=>{const p=Math.max(0,Math.min(100,Number(e.target.value)||0));if(p===0){openBot('sebastian');setDot(roster.querySelector('[data-roster-key="local::tanya"]'),true)}else openBot('tanya');const row=roster.querySelector('[data-roster-key="local::tanya"]');row.setAttribute('data-demo-progress','');row.style.setProperty('--demo-progress',p/100)};
if(new URLSearchParams(location.search).has('allfolders'))for(const header of roster.querySelectorAll('[aria-expanded="false"]'))header.click();
if(new URLSearchParams(location.search).get('compact')==='1'){resize(210);for(const header of roster.querySelectorAll('[aria-expanded="false"]'))header.click()}
window.addEventListener('pagehide',()=>disposers.reverse().forEach(fn=>fn()));
</script></html>
